<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.blurb | default: site.description }}">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body class="{{ page.class }}">
  <main class="wrap">
    {{ content }}
  </main>
  <svg class="scroll-hint" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
    <path class="scroll-hint-outline" d="M6 5 L24 21 L42 5 M6 27 L24 43 L42 27" />
    <path class="scroll-hint-fill" d="M6 5 L24 21 L42 5 M6 27 L24 43 L42 27" />
  </svg>
  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "09f2b407db3145bca9dae9d47de2412b"}'></script>
  <!-- End Cloudflare Web Analytics -->
  <script>
  // Give each project image a visible caption taken from its alt text, so the
  // writing runs down the page with the images instead of sitting in one block.
  // Caption is aria-hidden because the alt text already names the image.
  (function () {
    document.querySelectorAll('article p').forEach(function (p) {
      var imgs = p.querySelectorAll('img');
      if (!imgs.length || p.textContent.trim() !== '') return;
      var frag = document.createDocumentFragment();
      imgs.forEach(function (img) {
        var fig = document.createElement('figure');
        fig.appendChild(img);
        var alt = img.getAttribute('alt');
        if (alt) {
          var cap = document.createElement('figcaption');
          cap.textContent = alt;
          cap.setAttribute('aria-hidden', 'true');
          fig.appendChild(cap);
        }
        frag.appendChild(fig);
      });
      p.replaceWith(frag);
    });
  })();

  // Reveal project rows as they enter the All Projects list.
  (function () {
    var list = document.querySelector('.all-projects');
    if (!list || !('IntersectionObserver' in window) ||
        window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var reveal = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        reveal.unobserve(entry.target);
      });
    }, { threshold: 0.08 });
    list.querySelectorAll('.row').forEach(function (row) {
      row.classList.add('project-list-reveal');
      reveal.observe(row);
    });
  })();

  // Keep a quiet cue at the bottom of the first viewport, then remove it as
  // soon as the reader starts moving through the page.
  (function () {
    var hint = document.querySelector('.scroll-hint');
    if (!hint) return;
    var update = function () {
      var atHeroStart = document.body.classList.contains('hero-start');
      hint.classList.toggle('is-hidden', window.scrollY > 8 && !atHeroStart);
    };
    update();
    window.addEventListener('scroll', update, { passive: true });
    ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (e) {
      window.addEventListener(e, update, { passive: true });
    });
  })();
  </script>
</body>
</html>
