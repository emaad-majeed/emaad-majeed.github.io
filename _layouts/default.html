<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.blurb | default: site.description }}">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body class="{{ page.class }}">
  <main class="wrap">
    {{ content }}
  </main>
  <script>
  // Give each project image a visible caption taken from its alt text, so the
  // writing runs down the page with the images instead of sitting in one block.
  // Caption is aria-hidden because the alt text already names the image.
  (function () {
    document.querySelectorAll('article p').forEach(function (p) {
      var imgs = p.querySelectorAll('img');
      if (!imgs.length || p.textContent.trim() !== '') return;
      var frag = document.createDocumentFragment();
      imgs.forEach(function (img) {
        var fig = document.createElement('figure');
        fig.appendChild(img);
        var alt = img.getAttribute('alt');
        if (alt) {
          var cap = document.createElement('figcaption');
          cap.textContent = alt;
          cap.setAttribute('aria-hidden', 'true');
          fig.appendChild(cap);
        }
        frag.appendChild(fig);
      });
      p.replaceWith(frag);
    });
  })();
  </script>
</body>
</html>
